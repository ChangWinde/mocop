name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m compileall -q mocop tests
      - name: Python lint
        run: |
          python -m pip install ruff==0.12.11
          ruff check .
          ruff format --check .
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check mocop/static/app.js

  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install from source
        run: python -m pip install .
      - name: Verify installed command
        run: |
          cd /tmp
          mocop --help
          mocop init --config /tmp/mocop-ci.json
          mocop --config /tmp/mocop-ci.json --once > /tmp/snapshot.json
          python -c 'import json; data=json.load(open("/tmp/snapshot.json")); assert data["stats"]["servers"] == 0'
      - name: Browser smoke test
        run: node --experimental-websocket tests/browser_smoke.mjs
