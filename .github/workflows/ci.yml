name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Forge commit subjects
        run: python .github/scripts/check_commit_message.py --range HEAD

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m compileall -q src/mocop tests
      - name: Python lint
        run: |
          python -m pip install ruff==0.12.11
          ruff check .
          ruff format --check .
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -t . -v
      - name: JavaScript syntax
        run: |
          node --check src/mocop/static/app.js
          node --check src/mocop/static/capacity-match.js
          node --check src/mocop/static/capacity-watch.js
          node --check src/mocop/static/csv-export.js
          node --check src/mocop/static/dashboard-auth.js
          node --check src/mocop/static/format.js
          node --check src/mocop/static/process-search.js
          node --check src/mocop/static/update-pill.js
      - name: Capacity-match contract
        run: node tests/capacity_match_test.mjs
      - name: Capacity-watch contract
        run: node tests/capacity_watch_test.mjs
      - name: CSV-export contract
        run: node tests/csv_export_test.mjs
      - name: Dashboard-auth contract
        run: node tests/dashboard_auth_test.mjs
      - name: Update-pill contract
        run: node tests/update_pill_test.mjs
      - name: Process-search contract
        run: node tests/process_search_test.mjs

  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install from source
        run: python -m pip install .
      - name: Verify installed command
        run: |
          cd /tmp
          mocop --help
          mocop deploy --help
          mocop init --config /tmp/mocop-ci.json
          mocop --config /tmp/mocop-ci.json --once > /tmp/snapshot.json
          python -c 'import json; data=json.load(open("/tmp/snapshot.json")); assert data["stats"]["servers"] == 0'
      - name: Browser smoke test
        run: MOCOP_BROWSER_WARMUP_MS=8000 node --experimental-websocket tests/browser_smoke.mjs

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Branch coverage baseline
        run: |
          python -m pip install coverage==7.15.4
          coverage run --branch --source=src/mocop -m unittest discover -s tests -t . -p 'test_*.py' -q
          coverage report --fail-under=85

  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/mocop-dist .
      - name: Verify isolated wheel install
        run: |
          python -m venv /tmp/mocop-wheel-venv
          /tmp/mocop-wheel-venv/bin/python -m pip install --no-deps /tmp/mocop-dist/mocop-*.whl
          cd /tmp
          /tmp/mocop-wheel-venv/bin/mocop --help
          /tmp/mocop-wheel-venv/bin/mocop deploy --help
          /tmp/mocop-wheel-venv/bin/mocop init --config /tmp/mocop-wheel-config.json
          /tmp/mocop-wheel-venv/bin/mocop --config /tmp/mocop-wheel-config.json --once > /tmp/mocop-wheel-snapshot.json
          /tmp/mocop-wheel-venv/bin/python -c 'import json; data=json.load(open("/tmp/mocop-wheel-snapshot.json")); assert data["stats"]["servers"] == 0'
