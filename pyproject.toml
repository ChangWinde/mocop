[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mocop"
version = "0.10.1"
description = "AI-native GPU cluster monitor over OpenSSH."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-infrastructure", "cluster", "gpu", "monitoring", "nvidia", "ssh"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]

[project.scripts]
mocop = "mocop.__main__:main"

[project.urls]
Changelog = "https://github.com/ChangWinde/mocop/blob/master/docs/CHANGELOG.md"
Documentation = "https://github.com/ChangWinde/mocop/blob/master/docs/README.md"
Homepage = "https://github.com/ChangWinde/mocop"
Issues = "https://github.com/ChangWinde/mocop/issues"
Repository = "https://github.com/ChangWinde/mocop"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mocop", "mocop.static"]

[tool.setuptools.package-data]
mocop = ["default_config.json"]
"mocop.static" = ["*.html", "*.js", "*.css", "*.svg"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
